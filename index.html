@media(max-width:1100px){

</style>

function confirmModal(title, message, confirmText="Confirm", isDestructive=true){
  return new Promise(resolve => {
    open(title, `
      <div style="display:flex;flex-direction:column;gap:14px">
        <p style="font-size:13px;color:var(--ink)">${h(message)}</p>
        <div class="row sp" style="margin-top:6px">
          <button type="button" class="btn" id="cmCancel" style="flex:1">Cancel</button>
          <button type="button" class="btn ${isDestructive?'ghost':'pri'}" id="cmOk" style="flex:1">${h(confirmText)}</button>
        </div>
      </div>
    `, false, false);
    const cleanup = (val) => {
      dlg.close();
      resolve(val);
    };
    $("cmCancel").onclick = () => cleanup(false);
    $("cmOk").onclick = () => cleanup(true);
    const handleClose = () => {
      dlg.removeEventListener('close', handleClose);
      resolve(false);
    };
    dlg.addEventListener('close', handleClose, {once: true});
  });
}

function checkCalendarNotifications() {
  if (!window.Notification || Notification.permission !== "granted") return;
  const nowStr = today();
  const notifiedKey = "notified_events_" + nowStr;
  const notifiedList = JSON.parse(localStorage.getItem(notifiedKey) || "[]");

  S.events.forEach(ev => {
    if (ev.date === nowStr && !notifiedList.includes(ev.id)) {
      new Notification("📅 Rental Reminder: " + ev.title, {
        body: ev.note || "You have an event scheduled for today.",
        icon: "🏠"
      });
      notifiedList.push(ev.id);
      localStorage.setItem(notifiedKey, JSON.stringify(notifiedList));
    }
  });
}

const ST={paid:["Paid","#16a34a"],late:["Late","#d97706"],overdue:["Overdue","#dc2626"],unpaid:["Not paid","#64748b"],vacant:["Vacant","#0d9488"],maintenance:["Maintenance","#7c3aed"]};
function status(t){if(ST[t.manual_status])return t.manual_status;if(t.last_paid_month===month())return"paid";const n=new Date(),due=Math.min(t.due_day||5,new Date(n.getFullYear(),n.getMonth()+1,0).getDate()),d=n.getDate();return d<=due?"unpaid":d<=due+5?"late":"overdue"}
const stale=(c,d)=>c==="Daily"?d!==today():c==="Annual"?!d||d.slice(0,4)!==today().slice(0,4):false;

async function loadAll(){
  const [t,p,n,d,c,e,pr,pi]=await Promise.all(["tenants","checklist_progress","checklist_notes","tenant_documents","key_contacts","calendar_notes","projects","project_checklist"].map(x=>q(sb.from(x).select("*"))));
  S.tenants=t.sort((a,b)=>a.id-b.id);
  if(!S.dirty){S.prog={};p.forEach(r=>{if(!stale(r.checklist,r.last_saved_date))S.prog[`${r.tenant_id}|${r.checklist}|${r.item_index}`]=r.completed});S.notes={};n.forEach(r=>S.notes[r.tenant_id+"|"+r.checklist]=r.note)}
  S.docs={};
  if(d.length){const s=await q(sb.storage.from("tenant-documents").createSignedUrls(d.map(x=>x.file_path),3600)),m=new Map(s.map(x=>[x.path,x.signedUrl]));d.forEach(x=>{x.url=m.get(x.file_path)||"";(S.docs[x.tenant_id]||=[]).push(x)})}
  S.contacts=c.sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  S.events=e;S.projects=pr.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  S.items=pi.sort((a,b)=>a.item_index-b.item_index);
  if(!S.tenants.some(x=>x.id===S.tid))S.tid=S.tenants[0]?.id??null;
  checkCalendarNotifications();
}

$("lf").onsubmit=async e=>{
  e.preventDefault();
  const b=$("lb");
  b.disabled=true;
  $("le").textContent="";
  
  const emailVal = $("em").value.trim();
  const passwordVal = $("pw").value;
  const rememberMe = $("rm").checked;

  if (rememberMe) {
    localStorage.setItem('saved_manager_email', emailVal);
  } else {
    localStorage.removeItem('saved_manager_email');
  }

  try{
    const{error}=await sb.auth.signInWithPassword({email:emailVal,password:passwordVal});
    if(error)throw error;
  }catch(x){
    $("le").textContent=x.message;
    b.disabled=false;
  }
};

sb.auth.onAuthStateChange((ev,s)=>{
  if(s&&["INITIAL_SESSION","SIGNED_IN"].includes(ev))setTimeout(boot,0);
  else if(!s){$("app").hidden=true;$("login").hidden=false;$("lb").disabled=false;dlg.open&&dlg.close();hideLoader()}
});
async function boot(){
  if(booting)return;booting=true;
  try{
    const{data:{user}}=await sb.auth.getUser();
    const m=await sb.from("managers").select("is_approved").eq("email",user.email).maybeSingle();
    if(!m.data?.is_approved){await sb.auth.signOut();throw new Error("This account isn't approved as a manager yet. Ask the owner to approve it.")}
    await loadAll();$("login").hidden=true;$("app").hidden=false;render();
  }catch(e){toast(e.message,true);$("login").hidden=false}
  finally{booting=false;$("lb").disabled=false;hideLoader()}
}

  const n=L[S.tab].filter((_,i)=>S.prog[`${t.id}|${S.tab}|${i}`]).length;

  if($("pc")) $("pc").textContent=`${n} of ${L[S.tab].length} done · ${p}%`;
  if($("pb")) $("pb").style.width=p+"%";
}

async function deleteTenant(tenantId){
  const t = S.tenants.find(x => x.id === tenantId);
  if(!t) return;
  const confirmed = await confirmModal(
    "Delete Tenant",
    `Are you sure you want to delete tenant "${t.name}" (${t.unit})? This will also remove all associated files and logs.`
  );
  if(!confirmed) return;
  
  await run(async()=>{
    const docs = S.docs[tenantId] || [];
    if(docs.length > 0){
      const paths = docs.map(d => d.file_path);
      await sb.storage.from("tenant-documents").remove(paths);
    }
    await q(sb.from("tenants").delete().eq("id", tenantId));
    S.dirty = false;
    await loadAll();
    render();
  }, "Tenant deleted.");
}

const handleTenantActions = async (e) => {
  const tc = e.target.closest(".tc");
  if (tc) {
    const id = +tc.dataset.id;
    if (S.tid !== id) {
      if(S.dirty) await save(false);
      S.tid = id;
      render();
      if(innerWidth<=1100)$("colD").scrollIntoView({behavior:"smooth"});
      return;
    }
  }

  const b = e.target.closest("button");
  const t = act();
  if (b && t) {
    if (b.id === "et") tenantForm(t);
    else if (b.id === "th") history(t.id);
    else if (b.id === "dtnt") deleteTenant(t.id);
    else if (b.dataset.doc) delDoc(b.dataset.doc, b.dataset.path);
  }
};

async function setStatus(v){const t=act();await run(async()=>{const r=await q(sb.from("tenants").update({manual_status:["paid","unpaid"].includes(v)?null:v,last_paid_month:v==="paid"?month():""}).eq("id",t.id).select().single());Object.assign(t,r);render()},"Status updated.")}
async function save(reset){
  const t=act(),tab=S.tab;
  if(!t) return;
  if(reset){
    const confirmed = await confirmModal("Reset Checklist", `Reset the ${tab} checklist for ${t.name}?`);
    if(!confirmed) return;
  }
  const items=L[tab].map((text,i)=>({text,completed:!reset&&!!S.prog[`${t.id}|${tab}|${i}`]}));
  await run(async()=>{
    await q(sb.rpc("save_rental_checklist",{p_tenant_id:t.id,p_checklist:tab,p_items:items,p_note:reset?"":S.notes[t.id+"|"+tab]||"",p_saved_date:today(),p_reset:reset}));
    if(reset){L[tab].forEach((_,i)=>delete S.prog[`${t.id}|${tab}|${i}`]);delete S.notes[t.id+"|"+tab]}
    S.dirty=false;renderD();renderT();
  },reset?"Checklist reset.":"Checklist saved.");
}
async function upload(file){
  const t=act();if(!file||!t)return;if(file.size>10485760){toast("That file is over 10 MB.",true);return}
  const cat=$("dc").value,path=`tenant_${t.id}/${cat.toLowerCase()}_${Date.now()}_${file.name.replace(/[^\w.-]+/g,"_")}`;
  await run(async()=>{
    await q(sb.storage.from("tenant-documents").upload(path,file));
    try{await q(sb.from("tenant_documents").insert({tenant_id:t.id,category:cat,file_name:file.name,file_path:path,file_url:""}))}
    catch(e){await sb.storage.from("tenant-documents").remove([path]);throw e}
    S.docsOpen=true;await loadAll();render();
  },"File uploaded.");
}
async function delDoc(id,path){
  const confirmed = await confirmModal("Delete File", "Delete this file?");
  if(!confirmed)return;
  await run(async()=>{await q(sb.storage.from("tenant-documents").remove([path]));await q(sb.from("tenant_documents").delete().eq("id",id));S.docsOpen=true;await loadAll();render()},"File deleted.");
}

  const ev=[...S.events].sort((a,b)=>(b.pinned-a.pinned)||a.date.localeCompare(b.date));
  open("Calendar & Reminders",`<form id="cf" class="fm"><div class="two"><label>Date<input type="date" name="date" required value="${today()}"></label><label>Title<input name="title" required></label></div>
    <label>Notes<textarea name="note"></textarea></label><div class="row sp"><label class="chk"><input type="checkbox" name="pinned"> Pin to top</label><button class="btn pri">Add Event</button></div></form>
    ${ev.map(e=>`<div class="ev${e.pinned?" pin":""}${e.date<today()?" past":""}"><div><b>${e.pinned?"📌 ":""}${h(e.title)}</b> <small>${h(e.date)}</small><p>${h(e.note||"")}</p></div><button class="x" data-del="calendar_notes" data-id="${e.id}" aria-label="Delete event">×</button></div>`).join("")||'<p class="empty">No events scheduled.</p>'}`, false, true);
}
function projects(){
  open("Plans & Projects",`<form id="pf" class="fm" style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center"><input name="title" required placeholder="New plan or project…" aria-label="Project title" style="margin:0"><button class="btn pri" style="height:42px">Add Project</button></form>
  ${S.projects.map(p=>{const it=S.items.filter(i=>i.project_id===p.id),d=it.filter(i=>i.completed).length;return`<div class="card pj">
    <div class="row"><input class="ti" data-p="${p.id}" data-f="title" value="${h(p.title)}" aria-label="Project title"><button class="x" data-del="projects" data-id="${p.id}" aria-label="Delete project">×</button></div>
    <small>${d}/${it.length} completed</small>${it.map(i=>`<div class="row"><input type="checkbox" data-it="${i.id}" data-f="completed"${i.completed?" checked":""} aria-label="Done"><input class="ti${i.completed?" dn":""}" data-it="${i.id}" data-f="item_text" value="${h(i.item_text)}" aria-label="Item"><button class="x" data-del="project_checklist" data-id="${i.id}" aria-label="Delete item">×</button></div>`).join("")}
    <form class="ai" data-p="${p.id}"><input name="v" required placeholder="Add checklist item…" aria-label="New item"><button class="btn sm">Add</button></form>
    <textarea data-p="${p.id}" data-f="note" placeholder="Notes…">${h(p.note||"")}</textarea></div>`}).join("")||'<p class="empty">No active projects.</p>'}`, false, true);
}
const again=()=>{const s=$("db").scrollTop;projects();$("db").scrollTop=s};
function contacts(id){
  const c=S.contacts.find(x=>String(x.id)===String(id));
  open("Key Contacts Directory",`<form id="kf" class="fm">
    ${c ? `<input type="hidden" name="id" value="${h(c.id)}">` : ''}
    <div class="two"><label>Role / Position<input name="role" required value="${h(c?.role)}"></label><label>Name<input name="name" required value="${h(c?.name)}"></label></div>
    <div class="two"><label>Phone<input name="phone" required value="${h(c?.phone)}"></label><label>Icon (Emoji)<input name="emoji" maxlength="4" value="${h(c?.emoji)}"></label></div>
    <div class="row sp"><span>${c?'<button type="button" class="btn" data-cancel>Cancel</button>':""}</span><button class="btn pri">${c?"Update Contact":"Add Contact"}</button></div></form>
    ${S.contacts.map(c=>`<div class="ct" style="margin-top:8px"><span class="em">${h(c.emoji||"👤")}</span><div><small>${h(c.role)}</small><b>${h(c.name)}</b><span class="mut">${h(c.phone)}</span></div><button class="btn sm" data-edit="${c.id}">Edit</button><button class="x" data-del="key_contacts" data-id="${c.id}" aria-label="Delete contact">×</button></div>`).join("")}`, true, true);
}
function fmt(d){
  if(!d)return"No details recorded.";
  if(d.checklistName)return[`Note: ${d.note||"none"}`,"",...Object.entries(d.items||{}).map(([k,v])=>`${v?"✓":"○"} ${k}`)].join("\n");
  const lb={name:"Name",unit:"Unit",rent:"Rent",due_day:"Due day",phone:"Phone",lease_end:"Lease end",last_paid_month:"Last paid month",manual_status:"Status override",category:"Category",file_name:"File",file_path:"File Path"};
  return Object.entries(lb).filter(([k])=>d.before?.[k]!==d.after?.[k]).map(([k,v])=>`${v}: ${d.before?.[k]??"—"} → ${d.after?.[k]??"—"}`).join("\n")||JSON.stringify(d,null,2);
}
async function history(tid,page=0){
  const P=30,who=S.tenants.find(t=>t.id===tid);
  open(who?`History · ${who.name}`:"Activity History",'<p class="empty">Loading records…</p>', false, true);
  await run(async()=>{
    let r=sb.from("activity_logs").select("*").order("created_at",{ascending:false}).order("id",{ascending:false});if(tid)r=r.eq("tenant_id",tid);
    const rows=await q(r.range(page*P,(page+1)*P));
    $("db").innerHTML=`<div class="row sp" style="margin-bottom:12px"><span></span><button class="btn ghost sm" id="clearAllLogs">🧹 Clear All History</button></div>`+
      (rows.slice(0,P).map(l=>{
        const o=S.tenants.find(t=>t.id===l.tenant_id);
        return `<details class="hi"><summary><span><b>${h(o?`${o.name} (${o.unit})`:"General")}</b> — ${h(l.action)}</span><button class="btn ghost sm" data-del-log="${l.id}" style="padding:2px 6px">🗑️ Delete</button></summary><p class="mut">${h(l.performed_by||"Manager")} · ${new Date(l.created_at).toLocaleString()}</p><pre>${h(fmt(l.details))}</pre></details>`;
      }).join("")||'<p class="empty">No activity logged.</p>')
      +`<div class="row sp" style="margin-top:12px"><button class="btn" id="hp"${page?"":" disabled"}>Previous</button><span>Page ${page+1}</span><button class="btn" id="hn"${rows.length>P?"":" disabled"}>Next</button></div>`;
    $("hp").onclick=()=>history(tid,page-1);$("hn").onclick=()=>history(tid,page+1);
    $("clearAllLogs").onclick=async()=>{
      const ok=await confirmModal("Clear All History", "Are you sure you want to clear all history records?");
      if(!ok)return;
      run(async()=>{
        let query=sb.from("activity_logs").delete();
        if(tid)query=query.eq("tenant_id",tid);
        else query=query.neq("id",0);
        await q(query);
        history(tid,0);
      },"History cleared.");
    };
  });
}

const FORM={
  tf:d=>{const t=S.edit,n=!t;d.rent=+d.rent;d.due_day=+d.due_day||5;d.lease_end=d.lease_end||null;
    run(async()=>{const r=await q(n?sb.from("tenants").insert(d).select().single():sb.from("tenants").update(d).eq("id",t.id).select().single());S.tenants=n?[...S.tenants,r]:S.tenants.map(x=>x.id===r.id?r:x);S.tid=r.id;dlg.close();render()},n?"Tenant added.":"Tenant updated.")},
  cf:d=>run(async()=>{await q(sb.from("calendar_notes").insert({...d,pinned:!!d.pinned,notify:false}));await loadAll();render();calendar()},"Event added."),
  pf:d=>run(async()=>{await q(sb.from("projects").insert({title:d.title.trim()}));await loadAll();projects()},"Project added."),
  ai:(d,f)=>{const idx=S.items.filter(i=>String(i.project_id)===f.dataset.p).reduce((m,i)=>Math.max(m,i.item_index),-1)+1;
    run(async()=>{await q(sb.from("project_checklist").insert({project_id:f.dataset.p,item_index:idx,item_text:d.v.trim(),completed:false}));await loadAll();again()})},
  kf:d=>{
    const id=d.id;
    delete d.id;
    const isUpdate = Boolean(id && String(id).trim() !== "");
    run(async()=>{
      if(isUpdate){
        await q(sb.from("key_contacts").update(d).eq("id",id));
      } else {
        await q(sb.from("key_contacts").insert(d));
      }
      await loadAll();
      render();
      contacts();
    }, isUpdate ? "Contact updated." : "Contact added.");
  }
};

$("db").onsubmit=e=>{
  e.preventDefault();
  const f=e.target;
  const handler = FORM[f.id] || FORM[f.className];
  if(handler) handler(Object.fromEntries(new FormData(f)), f);
};

$("db").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.delLog){
    const confirmed = await confirmModal("Delete Log", "Delete this activity record?");
    if(!confirmed)return;
    run(async()=>{await q(sb.from("activity_logs").delete().eq("id",b.dataset.delLog));const who=S.tenants.find(t=>document.getTitle?.()?.includes(t.name));history(who?.id||null)},"Log deleted.");
    return;
  }
  if(b.dataset.edit)return contacts(b.dataset.edit);
  if("cancel"in b.dataset)return contacts();
  if(!b.dataset.del)return;
  const confirmed = await confirmModal("Confirm Deletion", "Delete this? This cannot be undone.");
  if(!confirmed)return;
  const tb=b.dataset.del;
  run(async()=>{await q(sb.from(tb).delete().eq("id",b.dataset.id));await loadAll();render();({calendar_notes:calendar,key_contacts:contacts,projects:again,project_checklist:again})[tb]()},"Deleted.");
};
$("db").onchange=e=>{
  const t=e.target,f=t.dataset.f;if(!f||f==="note")return;
  const tb=t.dataset.it?"project_checklist":"projects",id=t.dataset.it||t.dataset.p,v=t.type==="checkbox"?t.checked:t.value.trim();
  if(v===""){toast("This field cannot be empty. Use × to delete.",true);return again()}
  run(async()=>{await q(sb.from(tb).update({[f]:v}).eq("id",id));await loadAll();again()});
};
let nt;
$("db").oninput=e=>{const t=e.target;if(t.dataset.f!=="note")return;
  const p=S.projects.find(x=>String(x.id)===t.dataset.p);if(p)p.note=t.value;
  clearTimeout(nt);nt=setTimeout(async()=>{const{error}=await sb.from("projects").update({note:t.value}).eq("id",t.dataset.p);if(error)toast("Couldn't save note: "+error.message,true)},600)};
</script>
</body>
</html>
